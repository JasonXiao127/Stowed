# Keep npm workspaces and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Production advisories (express/music-metadata/adm-zip in the past) are
    # what matter here; group the rest to keep the noise down.
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
