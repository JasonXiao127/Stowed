# Release automation. Version the apps independently with tags:
#   stowed-web-v*    -> GHCR image + GitHub Release
#   stow-client-v*   -> Electron installers attached to a GitHub Release
#
# Uses the built-in GITHUB_TOKEN; no registry secrets are required. The web
# image publishes to GitHub Container Registry as ghcr.io/<owner>/<repo>.
# If the package is private, set its visibility to public in the package
# settings (or run `docker login ghcr.io` before pulling).

name: Release

on:
  push:
    tags:
      - 'stowed-web-v*'
      - 'stow-client-v*'

permissions:
  contents: write
  packages: write

jobs:
  image-publish:
    if: startsWith(github.ref_name, 'stowed-web-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Derive image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#stowed-web-v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stowed-web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes "Container image: \`$IMAGE:$VERSION\` and \`$IMAGE:latest\`." \
            || gh release view "$TAG" > /dev/null

  client-installers:
    if: startsWith(github.ref_name, 'stow-client-v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch desktop binaries (yt-dlp, ffmpeg, deno)
        run: npm run setup-binaries:client

      - name: Make installers
        run: npm run make:client

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: apps/stow-client/out/make/**/*
